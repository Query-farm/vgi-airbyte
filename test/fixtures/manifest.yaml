# A declarative (low-code) Airbyte source for the hermetic fixture API in
# test/fixture_api/server.py. Exercises bearer auth, cursor and offset
# pagination, an incremental DatetimeBasedCursor, and an upstream 403.
version: 6.44.0

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - items

definitions:
  requester:
    type: HttpRequester
    url_base: "{{ config['base_url'] }}/api/v1"
    http_method: GET
    authenticator:
      type: BearerAuthenticator
      api_token: "{{ config['api_token'] }}"

streams:
  - type: DeclarativeStream
    name: items
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/requester"
        path: /items
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: page_token
        page_size_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: limit
        pagination_strategy:
          type: CursorPagination
          cursor_value: "{{ response.next }}"
          stop_condition: "{{ response.next is none }}"
          page_size: "{{ config.get('page_size', 10) }}"
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%SZ"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config.get('start_date', '2025-01-01T00:00:00Z') }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      start_time_option:
        type: RequestOption
        inject_into: request_parameter
        field_name: updated_since
      is_data_feed: false
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/draft-07/schema#
        type: object
        properties:
          id:
            type: integer
          name:
            type: [string, "null"]
            description: Item name.
          price:
            type: [number, "null"]
          in_stock:
            type: [boolean, "null"]
          updated_at:
            type: string
            format: date-time
            airbyte_type: timestamp_with_timezone
          tags:
            type: [array, "null"]
            items:
              type: string
          dims:
            type: [object, "null"]
            properties:
              w:
                type: integer
              h:
                type: integer
          attributes:
            type: [object, "null"]
            additionalProperties: true

  - type: DeclarativeStream
    name: users
    primary_key:
      - user_id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/requester"
        path: /users
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - users
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: offset
        page_size_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: limit
        pagination_strategy:
          type: OffsetIncrement
          page_size: 3
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/draft-07/schema#
        type: object
        properties:
          user_id:
            type: string
          email:
            type: [string, "null"]
          admin:
            type: [boolean, "null"]

  - type: DeclarativeStream
    name: forbidden
    primary_key: []
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/requester"
        path: /forbidden
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        properties:
          id:
            type: integer

spec:
  type: Spec
  documentation_url: https://github.com/Query-farm/vgi-airbyte/tree/main/test/fixtures
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    title: Fixture API Spec
    type: object
    required:
      - base_url
      - api_token
    additionalProperties: true
    properties:
      base_url:
        type: string
        title: Base URL
        description: Root URL of the fixture API, e.g. http://127.0.0.1:8080.
        order: 0
      api_token:
        type: string
        title: API Token
        description: Bearer token for the fixture API.
        airbyte_secret: true
        order: 1
      start_date:
        type: string
        title: Start Date
        description: Only sync items updated at or after this instant.
        format: date-time
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        order: 2
      page_size:
        type: integer
        title: Page Size
        minimum: 1
        maximum: 100
        default: 10
        order: 3
